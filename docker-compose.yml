version: '3.8'

services:
  dfir-workbench:
    build: .
    container_name: dfir-memory-workbench
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DFIR_SECRET_KEY=${DFIR_SECRET_KEY:-}
      - DFIR_API_KEY=${DFIR_API_KEY:-}
      - DFIR_MAX_UPLOAD_MB=${DFIR_MAX_UPLOAD_MB:-65536}
    volumes:
      - ./workspace:/app/workspace
      - ./logs:/app/logs
